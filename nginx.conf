server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker Compose. Dùng biến $backend thay vì ghi thẳng
    # http://backend:8080 trong proxy_pass để nginx vẫn khởi động được khi
    # backend chưa kịp lên (tên service chưa được phân giải).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # ^~ để location regex bên dưới không "cướp" request API có đuôi file.
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Angular SPA: mọi đường dẫn không phải file thật đều trả index.html
    # để router phía client xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build có hash trong tên → cache dài hạn.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}
